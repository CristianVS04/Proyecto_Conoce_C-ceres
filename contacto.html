<!DOCTYPE html>

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <input type="checkbox" id="dark-mode-toggle" class="dark-mode-checkbox">
    <label for="dark-mode-toggle" class="dark-mode-btn" title="Alternar Modo Oscuro">🌙</label>

    <h1>Contacto</h1>

    <div class="top-bar">
      <img src="img/logo.png" alt="Conoce Cáceres Logo">

      <select>
        <option>ES</option>
        <option>EN</option>
        <option>FR</option>
      </select>

      <input type="text" placeholder="Buscar...">
      <button>Buscar</button>
    </div>
  </header>

  <nav class="desktop-nav">
    <a href="index.html">Inicio</a>
    <a href="atractivos.html">Atractivos</a>
    <a href="rutas.html">Rutas</a>
    <a href="planifica.html">Planifica</a>
    <a href="galeria.html">Galería</a>
    <a href="mapa.html">Mapa</a>
    <a href="#">Contacto</a>
  </nav>

  <input type="checkbox" id="menu-toggle" class="menu-checkbox">
  <label for="menu-toggle" class="menu-btn">&#9776; Menú</label>
  <nav class="mobile-nav">
    <a href="index.html">Inicio</a>
    <a href="atractivos.html">Atractivos</a>
    <a href="rutas.html">Rutas</a>
    <a href="planifica.html">Planifica</a>
    <a href="galeria.html">Galería</a>
    <a href="mapa.html">Mapa</a>
    <a href="#">Contacto</a>
  </nav>

  <main class="contacto-main">
    <section class="contacto-section">
      <h2>Formulario de contacto</h2>
      <form action="#" method="post">
        <input type="text" name="nombre" placeholder="Nombre completo" required>
        <input type="email" name="correo" placeholder="Correo electrónico" required>
        <input type="text" name="asunto" placeholder="Asunto" required>
        <textarea name="mensaje" rows="5" placeholder="Escribe tu mensaje" required></textarea>
        <button type="submit" class="btn-form">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Dirección • Información • Sugerencias</p>

        <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC">
